spring.application.name=investsim

# PostgreSQL — valores devem bater com .env / docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/investsim_db
spring.datasource.username=investsim_admin
spring.datasource.password=investsim_password

# Hibernate: validate = so verifica se o schema bate com as entidades (Flyway cuida de criar)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cache — Caffeine como backend ( TTL de 1 dia pra taxas do Bacen)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

# API SGS do Banco Central (timeouts configuraveis)
investsim.sgs.connect-timeout=5s
investsim.sgs.read-timeout=5s

